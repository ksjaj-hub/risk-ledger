name: data probe
on:
  push:
    branches: [tmp-form-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B="https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/ftp"
          for f in 12_Industry_Portfolios_daily_CSV 49_Industry_Portfolios_daily_CSV F-F_Research_Data_Factors_daily_CSV; do
            echo "== $f"
            curl -sL -m 60 -o $f.zip -w "HTTP %{http_code} %{size_download}\n" "$B/$f.zip" || true
            unzip -o -q $f.zip || true
          done
          ls -la
          for c in *.csv *.CSV; do [ -f "$c" ] || continue; echo "== $c"; head -c 900 "$c"; echo; grep -n "Average\|Equal\|Value" "$c" | head -5; wc -l "$c"; tail -4 "$c"; done
