name: data probe
on:
  push:
    branches: [tmp-form-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
          echo "== stooq"
          curl -sL -m 30 -A "$UA" -w "\nHTTP %{http_code}\n" "https://stooq.com/q/d/l/?s=xlk.us&i=d" | (head -c 400; echo; tail -c 200) || true
          echo "== yahoo chart"
          curl -sL -m 30 -A "$UA" -w "\nHTTP %{http_code}\n" "https://query1.finance.yahoo.com/v8/finance/chart/XLK?period1=883612800&period2=1795000000&interval=1d&events=div%2Csplit" | (head -c 500; echo; tail -c 150) || true
          echo "== yahoo query2"
          curl -sL -m 30 -A "$UA" -w "\nHTTP %{http_code}\n" "https://query2.finance.yahoo.com/v8/finance/chart/XLRE?range=max&interval=1d" | head -c 300 || true
