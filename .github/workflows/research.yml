name: rule research
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["scripts/research_v4d.py", ".github/workflows/research.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Compute
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        # rounds 1 to 3 (research_v4.py, _v4b.py, _v4c.py) are finished; run them by hand if their inputs change
        run: python scripts/research_v4d.py
      - name: Commit
        run: |
          git config user.name "risk-ledger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "rule research: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
