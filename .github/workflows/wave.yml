name: risk wave
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["scripts/wave.py", "waves/episodes.json", ".github/workflows/wave.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compute
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/wave.py
      - name: Commit
        run: |
          git config user.name "risk-ledger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add waves
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "risk wave: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
