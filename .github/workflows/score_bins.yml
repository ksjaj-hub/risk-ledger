name: score bands
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["scripts/score_bins.py", ".github/workflows/score_bins.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet numpy
      - run: python scripts/score_bins.py
      - name: Commit
        run: |
          git config user.name "risk-ledger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "score bands: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
