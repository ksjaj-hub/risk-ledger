name: backtest
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the rule over past data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python scripts/backtest.py
          python scripts/backtest.py --rule rules/candidates/v2-candidate.json
          python scripts/backtest.py --rule v3
      - name: Commit
        run: |
          git config user.name "risk-ledger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backtest
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "backtest: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push
