name: collect
on:
  schedule:
    # 13:23 and 22:47 UTC every day. The collector writes nothing when inputs have not changed.
    - cron: "23 13 * * *"
    - cron: "47 22 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: collect
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify existing chain
        run: python scripts/verify.py
      - name: Collect and judge
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/collect.py
      - name: Timestamp new files on Bitcoin (OpenTimestamps, best effort)
        continue-on-error: true
        run: |
          pip install --quiet opentimestamps-client
          git ls-files --others --exclude-standard -- records alerts | grep '\.json$' | while read -r f; do
            ots stamp "$f"
          done
          # complete earlier proofs once Bitcoin has confirmed them (proof files only, never the records)
          git ls-files -- 'records/**/*.ots' 'alerts/**/*.ots' | tail -n 40 | while read -r f; do
            ots upgrade "$f" || true
            rm -f "$f.bak"
          done
      - name: Rebuild the public page data
        run: python scripts/build_site.py
      - name: Commit
        run: |
          git config user.name "risk-ledger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add records alerts docs
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "record: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push
