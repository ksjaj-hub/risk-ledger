<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFMX: what is left after the news</title>
<meta name="description" content="A public, dated record of market risk states and of the events behind them. Written down before the outcome is known.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{color-scheme:dark;--bg:#07080a;--panel:#0d0f12;--hover:#12151a;--line:#1c2026;--line2:#2b3139;--fg:#e9ebee;--muted:#8d959e;--dim:#5b636c;--alert:#f0594b;--watch:#e2a43a;--clear:#79a596;--link:#86b4ee;--sans:"Archivo","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
body{color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums lining-nums;-webkit-font-smoothing:antialiased}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;width:100%}
button:focus-visible,a:focus-visible{outline:1px solid var(--link);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
.lbl{font-size:11px;font-stretch:88%;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.bar{border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:48px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-stretch:118%;letter-spacing:.09em;font-size:13px}
.bar a{color:var(--muted);font-size:12.5px}
.bar .r{display:flex;align-items:center;gap:14px}
.lang{display:flex;border:1px solid var(--line2)}
.lang button{width:auto;padding:5px 10px;font-size:11.5px;font-weight:600;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.now{padding:28px 0 22px;border-bottom:1px solid var(--line)}
.state{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-top:6px}
.state .name{font-size:54px;line-height:1;font-weight:700;font-stretch:112%;letter-spacing:-.01em}
.state .score{font-size:20px;color:var(--muted);font-weight:500}
.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:16px;max-width:420px}
.scale span{height:4px;background:var(--line2)}
.scale small{font-size:10.5px;color:var(--dim);letter-spacing:.05em;text-transform:uppercase;padding-top:5px}
.scale small.on{color:var(--fg)}
.asof{color:var(--muted);font-size:12.5px;margin-top:14px}
.comps{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line)}
.comp{padding:14px 12px 14px 0;border-right:1px solid var(--line);margin-right:12px;min-width:0}
.comp:last-child{border-right:0;margin-right:0}
.comp .lv{font-size:17px;font-weight:600;margin-top:2px}
.comp .dots{display:flex;gap:3px;margin-top:7px}
.comp .dots i{width:14px;height:3px;background:var(--line2)}
.comp .val{font-size:12px;color:var(--muted);margin-top:6px}
@media(max-width:700px){.comps{grid-template-columns:1fr 1fr}.comp{border-right:0;border-bottom:1px solid var(--line);margin-right:0}.comp:last-child{grid-column:1/-1;border-bottom:0}.state .name{font-size:44px}}
h2{font-size:15px;font-weight:600;margin:0}
.sec{padding:22px 0 6px}
.sec p{color:var(--muted);margin:4px 0 12px;max-width:64ch;font-size:13px}
.row{display:grid;grid-template-columns:92px 84px minmax(0,1fr);gap:0 12px;align-items:start;padding:11px 0;border-top:1px solid var(--line)}
button.row:hover{background:var(--hover)}
.row .d{color:var(--muted);font-size:12.5px;padding-top:2px}
.row .ti{font-weight:500;text-wrap:pretty}
.row .su{color:var(--muted);font-size:12.5px;margin-top:2px}
.tag{display:inline-block;font-size:10.5px;font-weight:700;font-stretch:90%;letter-spacing:.07em;padding:2px 0;width:78px;text-align:center;text-transform:uppercase;border:1px solid var(--line2);color:var(--muted)}
.tag.open,.tag.change{border-color:var(--watch);color:var(--watch)}
.tag.worsened{background:var(--alert);border-color:var(--alert);color:#12090a}
.tag.easing,.tag.resolved{color:var(--clear)}
@media(max-width:560px){.row{grid-template-columns:auto 1fr;gap:4px 10px}.row .body{grid-column:1/-1}}
.det{background:var(--panel);border-top:1px solid var(--line);padding:14px 14px 16px;font-size:13px}
.det h3{margin:14px 0 4px}.det h3:first-child{margin-top:0}
.det p{margin:0;color:var(--fg);max-width:68ch}
.det ul{margin:0;padding-left:18px;color:var(--fg)}
.det li{margin:2px 0}
.det .src{color:var(--muted);font-size:12px;margin-top:12px;overflow-wrap:anywhere}
.sub{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:16px 0;border-bottom:1px solid var(--line)}
.sub p{margin:0;color:var(--muted);font-size:13px;flex:1;min-width:220px}
.sub p b{color:var(--fg);font-weight:600}
.sub a.btn{display:inline-block;background:var(--fg);color:var(--bg);font-weight:600;font-size:13px;padding:11px 16px;min-height:44px;line-height:22px;white-space:nowrap}
.sub a.btn:hover{text-decoration:none;background:#fff}
.verify{border-top:1px solid var(--line);margin-top:22px;padding:20px 0 8px}
.verify ol{color:var(--muted);padding-left:18px;margin:8px 0 0;font-size:13px;max-width:68ch}
.foot{border-top:1px solid var(--line);color:var(--dim);font-size:12px;margin-top:18px}
.foot .wrap{padding-block:14px 28px}
</style>
</head>
<body>
<header class="bar"><div class="wrap">
  <div class="brand"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x=".5" y=".5" width="15" height="15" fill="none" stroke="#e9ebee"/><rect x="0" y="9" width="7" height="7" fill="#e9ebee"/></svg>AFMX</div>
  <div class="r"><a href="https://github.com/ksjaj-hub/risk-ledger" data-t="src">Source and full history</a><div class="lang" role="group" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="ko">한국어</button></div></div>
</div></header>
<main class="wrap">
  <section class="now" aria-live="polite">
    <div class="lbl" data-t="head">AFMX · US market risk state</div>
    <div class="state"><span class="name" id="state">…</span><span class="score" id="score"></span></div>
    <div class="scale" id="scale" aria-hidden="true"></div>
    <div class="asof" id="asof"></div>
  </section>
  <section class="comps" id="comps" aria-label="Components"></section>
  <section class="sub"><p><b data-t="subh"></b> <span data-t="subp"></span></p><a class="btn" href="https://forms.gle/HthFMyFsjLKKdDhWA" target="_blank" rel="noopener" data-t="subb"></a></section>
  <section class="sec"><h2 data-t="chg">State changes</h2><p data-t="chgp">Recorded automatically each time the state or a component level changes.</p><div id="alerts"></div></section>
  <section class="sec"><h2 data-t="ev">Open event risks</h2><p data-t="evp"></p><div id="events"></div></section>
  <section class="verify"><h2 data-t="ver"></h2><ol id="verify"></ol></section>
</main>
<footer class="foot"><div class="wrap" data-t="foot"></div></footer>
<script>
const $=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const COLORS=["#79a596","#b9c06a","#e2a43a","#f0594b"], STATES=["Calm","Watch","Elevated","Stress"];
const REPO="https://github.com/ksjaj-hub/risk-ledger";
const T={en:{subh:"AFMX Weekly.",subp:"One short note a week: what changed, what is still open, and which good news did not resolve anything. Free.",subb:"Get it by email",src:"Source and full history",head:"AFMX · US market risk state",chg:"State changes",chgp:"Recorded automatically each time the state or a component level changes.",ev:"Open event risks",
 evp:"AFMX tracks what is still unresolved after the headlines move on. Each card says what would have to be true for the risk to count as resolved. Those conditions were written on the date shown, before the outcome was known. Good news that does not meet them is listed too.",
 ver:"How to check that nothing here was changed afterwards",
 v:[["Every record is its own dated commit in a ","public history",REPO+"/commits/main","."],["Each record contains the fingerprint (SHA-256) of the record before it, so one edit would break the chain."],["Records carry ","OpenTimestamps","https://opentimestamps.org"," proofs anchored to the Bitcoin blockchain."],["The ","judging rule",REPO+"/blob/main/rules/v1.md"," is published and versioned. Old versions are never edited."]],
 foot:"This is a description of risk conditions. It is not a forecast, not a recommendation to buy or sell anything, and not investment advice. Inputs via FRED; most lag by about one trading day. VIX data: Copyright Chicago Board Options Exchange, Inc.",
 states:STATES,levels:["Low","Moderate","High","Extreme"],comp:{},of:" of 100",asof:"as of ",
 rec:(d,t,v,n)=>"Recorded "+d+" at "+t+" UTC under rule "+v+". "+n+" record"+(n===1?"":"s")+" so far.",
 start:"Start",change:"Change",first:"First record: ",state:"State",status:{open:"open",easing:"easing",worsened:"worsened",resolved:"resolved"},
 cond:"conditions written ",what:"What happened",how:"How it reaches markets",res:"Counts as resolved when all of these are true",wor:"Counts as worsened if any of these happens",rel:"Good news that does not resolve it",log:"Log",srcs:"Sources: ",none:"No record yet",fail:"Data could not be loaded",loc:"en-US"},
ko:{subh:"AFMX 주간 글.",subp:"일주일에 한 번, 짧게 보냅니다. 무엇이 바뀌었고, 무엇이 아직 열려 있으며, 어떤 호재가 아무것도 해소하지 못했는지 정리합니다. 무료이고 영어로 발행합니다.",subb:"이메일로 받기",src:"원본과 전체 기록",head:"AFMX · 미국 시장 리스크 상태",chg:"상태 변화",chgp:"상태나 요소의 단계가 바뀔 때마다 자동으로 기록됩니다.",ev:"열려 있는 사건 리스크",
 evp:"AFMX는 뉴스가 지나간 뒤에도 해결되지 않고 남아 있는 것을 추적합니다. 카드마다 무엇이 확인돼야 해소로 볼지 적혀 있습니다. 그 조건은 결과를 알기 전, 표시된 날짜에 적었습니다. 조건을 채우지 못하는 호재도 함께 적었습니다. 한국어는 읽기 편하도록 붙인 번역이고, 기록의 원문은 영어입니다.",
 ver:"나중에 고쳐 쓰지 않았다는 것을 확인하는 방법",
 v:[["모든 기록은 날짜가 찍힌 개별 변경으로 ","공개 이력",REPO+"/commits/main","에 남습니다."],["기록마다 바로 앞 기록의 지문(SHA-256)이 들어 있어서, 하나만 고쳐도 사슬이 끊어집니다."],["기록에는 비트코인 블록체인에 시각을 남기는 ","OpenTimestamps","https://opentimestamps.org"," 증명이 붙습니다."],["","판정 규칙",REPO+"/blob/main/rules/v1.ko.md","은 공개돼 있고 버전이 붙습니다. 이전 버전은 고치지 않습니다."]],
 foot:"이 페이지는 리스크 상태를 설명합니다. 예측이 아니며, 무엇을 사거나 팔라는 권유나 투자 조언이 아닙니다. 입력 자료는 FRED를 통해 받으며 대부분 약 1거래일 늦습니다. VIX 자료: Copyright Chicago Board Options Exchange, Inc.",
 states:["평온","주의","높음","위기"],levels:["낮음","보통","높음","매우 높음"],
 comp:{equity_volatility:"주식 변동성",credit_stress:"신용 불안",yield_curve:"금리 곡선",financial_conditions:"금융 여건",equity_drawdown:"주가 낙폭"},of:" / 100",asof:"기준일 ",
 rec:(d,t,v,n)=>d+" "+t+" UTC 기록, 규칙 "+v+". 지금까지 기록 "+n+"건.",
 start:"시작",change:"변화",first:"첫 기록: ",state:"상태",status:{open:"진행 중",easing:"완화",worsened:"악화",resolved:"해소"},
 cond:"조건 작성일 ",what:"무슨 일이 있었나",how:"시장에 미치는 경로",res:"아래가 모두 사실이면 해소로 봅니다",wor:"아래 중 하나라도 일어나면 악화로 봅니다",rel:"해소가 아닌 호재",log:"기록 (원문)",srcs:"출처: ",none:"아직 기록이 없습니다",fail:"자료를 불러오지 못했습니다",loc:"ko-KR"}};
let lang="en";try{lang=localStorage.getItem("lang")||((navigator.language||"").startsWith("ko")?"ko":"en")}catch(e){if((navigator.language||"").startsWith("ko"))lang="ko"}
let D=null;const open=new Set();
const fmt=d=>lang==="ko"?d.replaceAll("-","."):new Date(d+"T00:00:00Z").toLocaleDateString(T[lang].loc,{year:"numeric",month:"short",day:"numeric",timeZone:"UTC"});
function list(title,items){const f=document.createDocumentFragment();if(!items||!items.length)return f;f.append($("h3","lbl",title));const ul=$("ul");items.forEach(i=>ul.append($("li",null,i)));f.append(ul);return f}
const stName=s=>T[lang].states[STATES.indexOf(s)]||s, lvName=(c)=>T[lang].levels[c.level]||c.label;
function render(){
  const t=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t[e.dataset.t]);
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
  const vo=document.getElementById("verify");vo.replaceChildren();
  t.v.forEach(p=>{const li=$("li");if(p.length===1)li.textContent=p[0];else{const a=$("a",null,p[1]);a.href=p[2];li.append(p[0],a,p[3])}vo.append(li)});
  const st=document.getElementById("state");
  if(!D){st.textContent="…";return}
  const cn=id=>t.comp[id]||D.rule.components[id]||id;
  const L=D.latest,sc=document.getElementById("scale"),cs=document.getElementById("comps");sc.replaceChildren();cs.replaceChildren();
  if(L){
    const si=STATES.indexOf(L.state);st.textContent=stName(L.state);st.style.color=COLORS[si];
    document.getElementById("score").textContent="AFMX "+L.score+t.of;
    STATES.forEach((s,i)=>{const b=$("span");if(i<=si)b.style.background=COLORS[si];sc.append(b)});
    STATES.forEach((s,i)=>sc.append($("small",i===si?"on":"",t.states[i])));
    document.getElementById("asof").textContent=t.rec(fmt(L.recorded_at_utc.slice(0,10)),L.recorded_at_utc.slice(11,16),L.rule_version,D.history.length);
    Object.entries(L.components).forEach(([id,c])=>{
      const d=$("div","comp");d.append($("div","lbl",cn(id)));
      const lv=$("div","lv",lvName(c));lv.style.color=COLORS[c.level];d.append(lv);
      const dots=$("div","dots");for(let i=0;i<4;i++){const x=$("i");if(i<=c.level)x.style.background=COLORS[c.level];dots.append(x)}d.append(dots);
      d.append($("div","val",(c.value!=null?c.value+" · ":"")+t.asof+fmt(c.observation_date)));cs.append(d)});
  }else st.textContent=t.none;
  const lab=x=>{const i=["Low","Moderate","High","Extreme"].indexOf(x);return i>=0?t.levels[i]:stName(x)};
  const al=document.getElementById("alerts");al.replaceChildren();
  D.alerts.slice().reverse().forEach(a=>{
    const r=$("div","row");r.append($("div","d",fmt(a.issued_at_utc.slice(0,10))));
    r.append($("span","tag "+a.type,a.type==="baseline"?t.start:t.change));
    const b=$("div","body");
    b.append($("div","ti",(a.type==="baseline"?t.first:t.state+" ")+stName(a.state)+" ("+a.score+")"));
    if(a.changes.length)b.append($("div","su",a.changes.map(c=>(c.what==="state"?t.state:cn(c.what))+": "+lab(c.from)+" → "+lab(c.to)).join("; ")));
    r.append(b);al.append(r)});
  const ev=document.getElementById("events");ev.replaceChildren();
  const order={worsened:0,open:1,easing:2,resolved:3};
  D.events.slice().sort((a,b)=>(order[a.status]-order[b.status])||a.title.localeCompare(b.title)).forEach(e=>{
    const k=(lang==="ko"&&D.ko&&D.ko[e.id])||null, last=e.history[e.history.length-1], id="ev-"+e.id;
    const r=$("button","row");r.type="button";r.setAttribute("aria-expanded",String(open.has(e.id)));r.setAttribute("aria-controls",id);
    r.append($("div","d",fmt(last.date)));r.append($("span","tag "+e.status,t.status[e.status]||e.status));
    const b=$("div","body");b.append($("div","ti",k?k.title:e.title));b.append($("div","su",t.cond+fmt(e.resolution_conditions.written_on)));r.append(b);
    const d=$("div","det");d.id=id;d.hidden=!open.has(e.id);
    d.append($("h3","lbl",t.what),$("p",null,k?k.what:e.what_happened));
    d.append($("h3","lbl",t.how),$("p",null,k?k.channel:e.how_it_reaches_markets));
    d.append(list(t.res,k?k.resolved:e.resolution_conditions.resolved_when_all));
    d.append(list(t.wor,k?k.worse:e.resolution_conditions.worsened_when_any));
    d.append(list(t.rel,k?k.relief:e.relief_headlines_that_do_not_resolve_it));
    d.append(list(t.log,e.history.map(h=>fmt(h.date)+" · "+(t.status[h.status]||h.status)+" · "+h.note)));
    const s=$("div","src",t.srcs);e.sources.forEach((u,j)=>{const a=$("a",null,new URL(u).hostname.replace(/^www\./,""));a.href=u;a.rel="noopener";if(j)s.append(", ");s.append(a)});d.append(s);
    r.addEventListener("click",()=>{const o=d.hidden;d.hidden=!o;r.setAttribute("aria-expanded",String(o));o?open.add(e.id):open.delete(e.id)});
    ev.append(r,d)});
}
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;try{localStorage.setItem("lang",lang)}catch(e){}render()}));
render();
fetch("data.json").then(r=>r.json()).then(d=>{D=d;render()}).catch(()=>{document.getElementById("state").textContent=T[lang].fail});
</script>
</body>
</html>
