<style>
:root{color-scheme:dark;--bg:#07080a;--panel:#0d0f12;--hover:#12151a;--line:#1c2026;--line2:#2b3139;--fg:#e9ebee;--muted:#8d959e;--dim:#5b636c;--alert:#f0594b;--watch:#e2a43a;--clear:#79a596;--link:#86b4ee;--sans:"Archivo","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
html[lang="ko"] body{word-break:keep-all;overflow-wrap:anywhere}
body{color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums lining-nums;-webkit-font-smoothing:antialiased}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;width:100%}
button:focus-visible,a:focus-visible{outline:1px solid var(--link);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
.lbl{font-size:11px;font-stretch:88%;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.bar{border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:48px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-stretch:118%;letter-spacing:.09em;font-size:13px}
.bar a{color:var(--muted);font-size:12.5px}
.bar .r{display:flex;align-items:center;gap:14px}
.lang{display:flex;border:1px solid var(--line2)}
.lang button{width:auto;padding:5px 10px;font-size:11.5px;font-weight:600;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.hero{padding:30px 0 20px;border-bottom:1px solid var(--line)}
.hero h1{font-size:40px;line-height:1.06;font-weight:700;font-stretch:112%;letter-spacing:-.012em;margin:8px 0 10px;text-wrap:balance}
.hero .lead{color:var(--muted);font-size:15px;max-width:60ch;margin:0}
.top1{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
.wk ul{list-style:none;margin:8px 0 0;padding:0}
.wk li{display:grid;grid-template-columns:92px minmax(0,1fr);gap:0 12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.wk li time{color:var(--muted);font-size:12.5px;padding-top:1px;white-space:nowrap}
.cd{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 14px;align-items:center;margin-top:8px;color:var(--fg);min-height:44px}
.cd:hover{text-decoration:none}.cd:hover .t{text-decoration:underline}
.cd b{font-size:44px;line-height:1;font-weight:700;font-stretch:108%;color:var(--watch)}
.cd b small{font-size:13px;font-weight:600;color:var(--muted);margin-left:4px;letter-spacing:.04em}
.cd .t{font-weight:600;font-size:14.5px}
.cd .w{color:var(--muted);font-size:12.5px}
.none{color:var(--muted);font-size:13px;margin-top:8px}
@media(max-width:640px){.cd b{font-size:38px}}
.tally{color:var(--muted);font-size:12.5px;padding:12px 0 0;border-top:1px solid var(--line)}
.mine{padding:0 0 14px}
.secs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.secs button{width:auto;border:1px solid var(--line2);color:var(--muted);font-size:13px;padding:7px 11px;min-height:36px}
.secs button:hover{color:var(--fg);border-color:var(--muted)}
.secs button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg);font-weight:600}
#minemsg{display:block;color:var(--fg);font-size:13px;margin-top:10px}
#minemsg:empty{display:none}
.morebtn{width:100%;border-top:1px solid var(--line);padding:13px 0;color:var(--link);font-size:13.5px;text-align:left;min-height:44px}
.morebtn:hover{background:var(--hover)}
.tk{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tk i{font-style:normal;font-size:11.5px;font-weight:600;letter-spacing:.03em;border:1px solid var(--line2);color:var(--muted);padding:1px 6px}
.tk i.hit{border-color:var(--watch);color:var(--watch)}
.hitline{color:var(--watch);font-size:12.5px;margin-top:6px;font-weight:600}
.case{padding:14px 0;border-top:1px solid var(--line)}
.case .ti{font-size:16px;font-weight:600}
.case .out{font-size:10.5px;font-weight:700;font-stretch:90%;letter-spacing:.07em;text-transform:uppercase;margin-left:8px;white-space:nowrap}
.case .out.hit{color:var(--alert)}.case .out.ok{color:var(--clear)}
.case .src{color:var(--muted);font-size:12px;margin-top:6px;overflow-wrap:anywhere}
.hsnote{border:1px solid var(--line2);padding:8px 10px;font-size:12.5px;color:var(--muted);margin:0 0 4px;max-width:none}
.backdrop{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:6px;padding:11px 0 0;border-top:1px solid var(--line);color:var(--fg);min-height:44px}
.backdrop:hover{text-decoration:none}.backdrop:hover .more{text-decoration:underline}
.backdrop .bs{font-weight:700;font-size:15px}
.backdrop .bn{color:var(--muted);font-size:13px}
.backdrop .more{color:var(--link);font-size:12.5px;margin-left:auto}
.scale{display:inline-grid;grid-template-columns:repeat(4,18px);gap:2px}
.scale span{height:4px;background:var(--line2)}
@media(max-width:560px){.hero h1{font-size:30px}}
.asof{color:var(--muted);font-size:12.5px;margin:0 0 4px}
.comps{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:10px}
.comp{padding:14px 12px 14px 0;border-right:1px solid var(--line);margin-right:12px;min-width:0}
.comp:last-child{border-right:0;margin-right:0}
.comp .lv{font-size:17px;font-weight:600;margin-top:2px}
.comp .dots{display:flex;gap:3px;margin-top:7px}
.comp .dots i{width:14px;height:3px;background:var(--line2)}
.comp .val{font-size:12px;color:var(--muted);margin-top:6px}
@media(max-width:700px){.comps{grid-template-columns:1fr 1fr}.comp{border-right:0;border-bottom:1px solid var(--line);margin-right:0}.comp:last-child{grid-column:1/-1;border-bottom:0}}
h2{font-size:15px;font-weight:600;margin:0}
.sec{padding:22px 0 6px}
.sec p{color:var(--muted);margin:4px 0 12px;max-width:64ch;font-size:13px}
.row{display:grid;grid-template-columns:92px 84px minmax(0,1fr);gap:0 12px;align-items:start;padding:11px 0;border-top:1px solid var(--line)}
button.row:hover{background:var(--hover)}
.row .d{color:var(--muted);font-size:12.5px;padding-top:2px}
.row .ti{font-weight:500;text-wrap:pretty}
.row .su{color:var(--muted);font-size:12.5px;margin-top:2px}
.row .ti.big{font-size:16px;font-weight:600}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px;margin:8px 0 6px;font-size:13px}
.kv dt{font-size:10.5px;font-stretch:88%;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-top:2px;white-space:nowrap}
.kv dt.need{color:var(--watch)}
.kv dd{margin:0;color:var(--fg)}
.kv dd.gn{color:var(--muted)}
.kv dd small{color:var(--muted);font-size:12px}
.tag{display:inline-block;font-size:10.5px;font-weight:700;font-stretch:90%;letter-spacing:.07em;padding:2px 0;width:78px;text-align:center;text-transform:uppercase;border:1px solid var(--line2);color:var(--muted)}
.tag.open,.tag.change{border-color:var(--watch);color:var(--watch)}
.tag.worsened{background:var(--alert);border-color:var(--alert);color:#12090a}
.tag.easing,.tag.resolved{color:var(--clear)}
@media(max-width:560px){.row{grid-template-columns:auto 1fr;gap:4px 10px}.row .body{grid-column:1/-1}}
.det{background:var(--panel);border-top:1px solid var(--line);padding:14px 14px 16px;font-size:13px}
.det h3{margin:14px 0 4px}.det h3:first-child{margin-top:0}
.det p{margin:0;color:var(--fg);max-width:68ch}
.det ul{margin:0;padding-left:18px;color:var(--fg)}
.det li{margin:2px 0}
.det .src{color:var(--muted);font-size:12px;margin-top:12px;overflow-wrap:anywhere}
.sub{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:16px 0;border-bottom:1px solid var(--line)}
.sub p{margin:0;color:var(--muted);font-size:13px;flex:1;min-width:220px}
.sub p b{color:var(--fg);font-weight:600}
.sub form{display:flex;flex-wrap:wrap;gap:0;align-items:stretch;flex:1;min-width:260px;max-width:440px}
.sub input{flex:1;min-width:0;background:transparent;border:1px solid var(--line2);border-right:0;color:var(--fg);font:inherit;font-size:16px;padding:10px 12px;min-height:44px;border-radius:0;outline:none}
.sub input:focus{border-color:var(--fg)}
.sub input::placeholder{color:var(--muted)}
.sub button.btn{width:auto;background:var(--fg);color:var(--bg);border:1px solid var(--fg);font-weight:600;font-size:13px;padding:0 16px;min-height:44px;white-space:nowrap;cursor:pointer;border-radius:0}
.sub button.btn:hover{background:#fff}
.sub button.btn:disabled{opacity:.6;cursor:default}
#subs{flex-basis:100%;font-size:12.5px;color:var(--muted);margin-top:6px}
#subs:empty{display:none}
.sub form.done input,.sub form.done button{display:none}
.sub form.done #subs{color:var(--fg);font-size:13px;margin:0}
.verify{border-top:1px solid var(--line);margin-top:22px;padding:6px 0 8px}
.verify summary{cursor:pointer;color:var(--muted);font-size:13px;padding:10px 0;min-height:44px}
.verify summary:hover{color:var(--fg)}
.verify ol{color:var(--muted);padding-left:18px;margin:8px 0 0;font-size:13px;max-width:68ch}
.foot{border-top:1px solid var(--line);color:var(--dim);font-size:12px;margin-top:18px}
.foot .wrap{padding-block:14px 28px}
</style>
</head>
